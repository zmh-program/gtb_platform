name: Crowdin Crawler

on:
  workflow_dispatch:
    inputs:
      crowdin_cookie:
        description: "Crowdin Cookie"
        required: false
        type: string
      crowdin_csrf_token:
        description: "Crowdin CSRF Token"
        required: false
        type: string
      max_concurrency:
        description: "Crawler max concurrency"
        required: false
        type: string
        default: "32"
      meta_language_id:
        description: "Meta Language (the language translation group that you've joined)"
        required: false
        type: choice
        default: "Chinese Simplified (55)"
        options:
          - "Chinese Simplified (55)"
          - "Russian (41)"
          - "Chinese Traditional (56)"
          - "Czech (9)"
          - "Danish (10)"
          - "Dutch (33)"
          - "Finnish (18)"
          - "French (2)"
          - "German (11)"
          - "Hungarian (22)"
          - "Italian (24)"
          - "Japanese (25)"
          - "Korean (27)"
          - "Norwegian (36)"
          - "Pirate English (109)"
          - "Polish (38)"
          - "Portuguese (40)"
          - "Portuguese, Brazilian (63)"
          - "Romanian (1)"
          - "Spanish (3)"
          - "Swedish (48)"
          - "Turkish (50)"
          - "Ukrainian (52)"

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      CROWDIN_MAX_CONCURRENCY: ${{ inputs.max_concurrency || '32' }}
      RUSTFLAGS: -C debuginfo=0
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crowdin_api -> target

      - name: Build Rust binaries
        run: cargo build --manifest-path crowdin_api/Cargo.toml --quiet --locked --bin crawler --bin analysis --bin summary

      - name: Run crawler
        env:
          CROWDIN_COOKIE: ${{ inputs.crowdin_cookie || secrets.CROWDIN_COOKIE }}
          CROWDIN_CSRF_TOKEN: ${{ inputs.crowdin_csrf_token || secrets.CROWDIN_CSRF_TOKEN }}
          META_LANGUAGE_ID: ${{ inputs.meta_language_id || 'Chinese Simplified (55)' }}
        run: ./crowdin_api/target/debug/crawler

      - name: Run analysis
        run: ./crowdin_api/target/debug/analysis

      - name: Check for translations-data changes
        id: check_changes
        run: |
          if git diff --quiet lib/source/translations-data.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Build change summary
        if: steps.check_changes.outputs.has_changes == 'true'
        id: change_summary
        run: |
          previous_file="$(mktemp)"
          if ! git show HEAD:lib/source/translations-data.json > "$previous_file" 2>/dev/null; then
            printf '[]\n' > "$previous_file"
          fi
          ./crowdin_api/target/debug/summary --current lib/source/translations-data.json --previous "$previous_file" >> "$GITHUB_OUTPUT"
          rm -f "$previous_file"

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.change_summary.outputs.commit_message }}
          title: "chore(crowdin): sync translations db"
          body: |
            Automated Crowdin data update.

            Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          branch: crowdin-update
          delete-branch: true
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>

      - name: Trigger PR Diff Comment
        if: steps.cpr.outputs.pull-request-number
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: pr-diff-comment
          client-payload: '{"pr_number": "${{ steps.cpr.outputs.pull-request-number }}"}'
