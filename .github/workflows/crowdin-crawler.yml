name: Crowdin Crawler

on:
  workflow_dispatch:
    inputs:
      crowdin_cookie:
        description: "Crowdin Cookie"
        required: false
        type: string
      crowdin_csrf_token:
        description: "Crowdin CSRF Token"
        required: false
        type: string
      meta_language_id:
        description: "Meta Language (the one you've joined)"
        required: false
        type: choice
        default: "Russian (41)"
        options:
          - "Russian (41)"
          - "Chinese Simplified (55)"
          - "Chinese Traditional (56)"
          - "Czech (9)"
          - "Danish (10)"
          - "Dutch (33)"
          - "Finnish (18)"
          - "French (2)"
          - "German (11)"
          - "Hungarian (22)"
          - "Italian (24)"
          - "Japanese (25)"
          - "Korean (27)"
          - "Norwegian (36)"
          - "Pirate English (109)"
          - "Polish (38)"
          - "Portuguese (40)"
          - "Portuguese, Brazilian (63)"
          - "Romanian (1)"
          - "Spanish (3)"
          - "Swedish (48)"
          - "Turkish (50)"
          - "Ukrainian (52)"

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          cd crowdin_api
          pip install -r requirements.txt || pip install requests
          pnpm install

      - name: Run crawler
        env:
          CROWDIN_COOKIE: ${{ inputs.crowdin_cookie || secrets.CROWDIN_COOKIE }}
          CROWDIN_CSRF_TOKEN: ${{ inputs.crowdin_csrf_token || secrets.CROWDIN_CSRF_TOKEN }}
          META_LANGUAGE_ID: ${{ inputs.meta_language_id || 'Russian (41)' }}
        run: pnpm crawler

      - name: Run analysis
        run: pnpm analysis

      - name: Run prettier
        run: pnpm prettier

      - name: Check for translations-data changes
        id: check_changes
        run: |
          if git diff --quiet lib/source/translations-data.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update db"
          title: "chore: update db"
          body: |
            Automated Crowdin data update.

            Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          branch: crowdin-update
          delete-branch: true
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>

      - name: Trigger PR Diff Comment
        if: steps.cpr.outputs.pull-request-number
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: pr-diff-comment
          client-payload: '{"pr_number": "${{ steps.cpr.outputs.pull-request-number }}"}'
