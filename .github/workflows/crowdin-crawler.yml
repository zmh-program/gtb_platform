name: Crowdin Crawler

on:
  workflow_dispatch:
    inputs:
      crowdin_cookie:
        description: "Crowdin Cookie"
        required: false
        type: string
      crowdin_csrf_token:
        description: "Crowdin CSRF Token"
        required: false
        type: string
      meta_language_id:
        description: "Meta Language (the language translation group that you've joined)"
        required: false
        type: choice
        default: "Chinese Simplified (55)"
        options:
          - "Chinese Simplified (55)"
          - "Russian (41)"
          - "Chinese Traditional (56)"
          - "Czech (9)"
          - "Danish (10)"
          - "Dutch (33)"
          - "Finnish (18)"
          - "French (2)"
          - "German (11)"
          - "Hungarian (22)"
          - "Italian (24)"
          - "Japanese (25)"
          - "Korean (27)"
          - "Norwegian (36)"
          - "Pirate English (109)"
          - "Polish (38)"
          - "Portuguese (40)"
          - "Portuguese, Brazilian (63)"
          - "Romanian (1)"
          - "Spanish (3)"
          - "Swedish (48)"
          - "Turkish (50)"
          - "Ukrainian (52)"

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C debuginfo=0
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crowdin_api -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --ignore-scripts

      - name: Build Rust binaries
        run: cargo build --manifest-path crowdin_api/Cargo.toml --quiet --locked --bin crawler --bin analysis

      - name: Run crawler
        env:
          CROWDIN_COOKIE: ${{ inputs.crowdin_cookie || secrets.CROWDIN_COOKIE }}
          CROWDIN_CSRF_TOKEN: ${{ inputs.crowdin_csrf_token || secrets.CROWDIN_CSRF_TOKEN }}
          META_LANGUAGE_ID: ${{ inputs.meta_language_id || 'Chinese Simplified (55)' }}
        run: ./crowdin_api/target/debug/crawler

      - name: Run analysis
        run: ./crowdin_api/target/debug/analysis

      - name: Run prettier
        run: pnpm exec prettier --write lib/source/translations-data.json lib/source/versions.json

      - name: Check for translations-data changes
        id: check_changes
        run: |
          if git diff --quiet lib/source/translations-data.json; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Build change summary
        if: steps.check_changes.outputs.has_changes == 'true'
        id: change_summary
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const current = JSON.parse(fs.readFileSync("lib/source/translations-data.json", "utf8"));
          let previous = [];
          try {
            previous = JSON.parse(
              execFileSync("git", ["show", "HEAD:lib/source/translations-data.json"], {
                encoding: "utf8",
              })
            );
          } catch {}

          const currentMap = new Map(current.map((item) => [item.theme, item]));
          const previousMap = new Map(previous.map((item) => [item.theme, item]));
          const themes = [...new Set([...currentMap.keys(), ...previousMap.keys()])].sort();

          let changedThemes = 0;
          let changedTranslations = 0;

          for (const theme of themes) {
            const currentItem = currentMap.get(theme);
            const previousItem = previousMap.get(theme);

            if (JSON.stringify(currentItem) !== JSON.stringify(previousItem)) {
              changedThemes += 1;
            }

            const currentTranslations = currentItem?.translations ?? {};
            const previousTranslations = previousItem?.translations ?? {};
            const languages = new Set([
              ...Object.keys(currentTranslations),
              ...Object.keys(previousTranslations),
            ]);

            for (const language of languages) {
              if (
                JSON.stringify(currentTranslations[language]) !==
                JSON.stringify(previousTranslations[language])
              ) {
                changedTranslations += 1;
              }
            }
          }

          process.stdout.write(
            `commit_message=chore(crowdin): sync translations db (${changedThemes} themes, ${changedTranslations} translations)\n`
          );
          NODE

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.change_summary.outputs.commit_message }}
          title: "chore(crowdin): sync translations db"
          body: |
            Automated Crowdin data update.

            Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
          branch: crowdin-update
          delete-branch: true
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>

      - name: Trigger PR Diff Comment
        if: steps.cpr.outputs.pull-request-number
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: pr-diff-comment
          client-payload: '{"pr_number": "${{ steps.cpr.outputs.pull-request-number }}"}'
