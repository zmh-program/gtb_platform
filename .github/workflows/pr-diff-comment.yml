name: PR Diff Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "lib/source/translations-data.json"
      - "lib/source/versions.json"

jobs:
  diff-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate diff report
        id: diff
        run: |
          node << 'EOF' > diff_report.md
          const fs = require('fs');

          let report = '';

          // versions.json diff
          const versionsChanged = (() => {
            try {
              const basePath = 'base/lib/source/versions.json';
              const prPath = 'pr/lib/source/versions.json';

              const baseExists = fs.existsSync(basePath);
              const prExists = fs.existsSync(prPath);

              if (!baseExists && !prExists) return null;

              const baseData = baseExists ? JSON.parse(fs.readFileSync(basePath, 'utf8')) : {};
              const prData = prExists ? JSON.parse(fs.readFileSync(prPath, 'utf8')) : {};

              if (baseData.last_updated !== prData.last_updated) {
                return {
                  from: baseData.last_updated || '(empty)',
                  to: prData.last_updated || '(empty)'
                };
              }
              return null;
            } catch (e) {
              return null;
            }
          })();

          // translations-data.json diff
          const translationsChanges = (() => {
            try {
              const basePath = 'base/lib/source/translations-data.json';
              const prPath = 'pr/lib/source/translations-data.json';

              const baseExists = fs.existsSync(basePath);
              const prExists = fs.existsSync(prPath);

              if (!baseExists && !prExists) return { added: [], removed: [], modified: [] };

              const baseData = baseExists ? JSON.parse(fs.readFileSync(basePath, 'utf8')) : [];
              const prData = prExists ? JSON.parse(fs.readFileSync(prPath, 'utf8')) : [];

              const baseMap = new Map(baseData.map(item => [item.id, item]));
              const prMap = new Map(prData.map(item => [item.id, item]));

              const added = [];
              const removed = [];
              const modified = [];

              for (const [id, prItem] of prMap) {
                const baseItem = baseMap.get(id);
                if (!baseItem) {
                  added.push(prItem);
                } else {
                  const shortcutChanged = baseItem.shortcut !== prItem.shortcut;
                  const baseMultiwords = JSON.stringify(baseItem.multiwords || []);
                  const prMultiwords = JSON.stringify(prItem.multiwords || []);
                  const multiwordsChanged = baseMultiwords !== prMultiwords;

                  if (shortcutChanged || multiwordsChanged) {
                    modified.push({ base: baseItem, pr: prItem, shortcutChanged, multiwordsChanged });
                  }
                }
              }

              for (const [id, baseItem] of baseMap) {
                if (!prMap.has(id)) {
                  removed.push(baseItem);
                }
              }

              return { added, removed, modified };
            } catch (e) {
              console.error(e);
              return { added: [], removed: [], modified: [] };
            }
          })();

          // Build report
          report += '## Database Changes Report\n\n';

          // Versions section
          report += '### Version Update\n\n';
          if (versionsChanged) {
            report += '| Before | After |\n';
            report += '|--------|-------|\n';
            report += `| \`${versionsChanged.from}\` | \`${versionsChanged.to}\` |\n`;
          } else {
            report += '_No version changes detected._\n';
          }
          report += '\n';

          // Translations section
          report += '### Shortcut / Multiword Changes\n\n';

          const { added, removed, modified } = translationsChanges;
          const hasChanges = added.length > 0 || removed.length > 0 || modified.length > 0;

          if (!hasChanges) {
            report += '_No shortcut or multiword changes detected._\n';
          } else {
            const formatItem = (item) => {
              return {
                shortcut: item.shortcut || null,
                multiwords: (item.multiwords || []).map(m => m.multiword)
              };
            };

            const generateDiff = (base, pr, shortcutChanged, multiwordsChanged) => {
              let diff = '```diff\n{\n';
              if (shortcutChanged) {
                diff += `-  "shortcut": ${JSON.stringify(base.shortcut)},\n`;
                diff += `+  "shortcut": ${JSON.stringify(pr.shortcut)},\n`;
              } else {
                diff += `   "shortcut": ${JSON.stringify(pr.shortcut)},\n`;
              }
              if (multiwordsChanged) {
                diff += `-  "multiwords": ${JSON.stringify(base.multiwords, null, 2).split('\n').join('\n-  ')}\n`;
                diff += `+  "multiwords": ${JSON.stringify(pr.multiwords, null, 2).split('\n').join('\n+  ')}\n`;
              } else {
                diff += `   "multiwords": ${JSON.stringify(pr.multiwords)}\n`;
              }
              diff += '}\n```\n\n';
              return diff;
            };

            // Added themes
            if (added.length > 0) {
              report += '<details>\n';
              report += `<summary><strong>Added Themes (${added.length})</strong></summary>\n\n`;
              for (const item of added) {
                const formatted = formatItem(item);
                report += `**${item.theme}**\n\n`;
                report += '```diff\n{\n';
                report += `+  "shortcut": ${JSON.stringify(formatted.shortcut)},\n`;
                report += `+  "multiwords": ${JSON.stringify(formatted.multiwords, null, 2).split('\n').join('\n+  ')}\n`;
                report += '}\n```\n\n';
              }
              report += '</details>\n\n';
            }

            // Removed themes
            if (removed.length > 0) {
              report += '<details>\n';
              report += `<summary><strong>Removed Themes (${removed.length})</strong></summary>\n\n`;
              for (const item of removed) {
                const formatted = formatItem(item);
                report += `**${item.theme}**\n\n`;
                report += '```diff\n{\n';
                report += `-  "shortcut": ${JSON.stringify(formatted.shortcut)},\n`;
                report += `-  "multiwords": ${JSON.stringify(formatted.multiwords, null, 2).split('\n').join('\n-  ')}\n`;
                report += '}\n```\n\n';
              }
              report += '</details>\n\n';
            }

            // Modified themes
            if (modified.length > 0) {
              report += '<details>\n';
              report += `<summary><strong>Modified Themes (${modified.length})</strong></summary>\n\n`;
              for (const item of modified) {
                const baseFormatted = formatItem(item.base);
                const prFormatted = formatItem(item.pr);
                report += `**${item.pr.theme}**\n\n`;
                report += generateDiff(baseFormatted, prFormatted, item.shortcutChanged, item.multiwordsChanged);
              }
              report += '</details>\n\n';
            }
          }

          report += '---\n';
          report += '_This comment is automatically generated._\n';

          fs.writeFileSync('diff_report.md', report);
          console.log('Report generated successfully');
          EOF

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "## Database Changes Report"

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: diff_report.md
          edit-mode: replace
