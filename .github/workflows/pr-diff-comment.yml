name: PR Diff Comment

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "lib/source/translations-data.json"
      - "lib/source/versions.json"
  repository_dispatch:
    types: [pr-diff-comment]

jobs:
  diff-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'repository_dispatch') {
              prNumber = parseInt(context.payload.client_payload.pr_number);
            } else {
              prNumber = context.payload.pull_request.number;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('number', prNumber);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_sha', pr.base.sha);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate diff report
        id: diff
        run: |
          node << 'EOF' > diff_report.md
          const fs = require('fs');

          let report = '';

          // versions.json diff
          const versionsChanged = (() => {
            try {
              const basePath = 'base/lib/source/versions.json';
              const prPath = 'pr/lib/source/versions.json';

              const baseExists = fs.existsSync(basePath);
              const prExists = fs.existsSync(prPath);

              if (!baseExists && !prExists) return null;

              const baseData = baseExists ? JSON.parse(fs.readFileSync(basePath, 'utf8')) : {};
              const prData = prExists ? JSON.parse(fs.readFileSync(prPath, 'utf8')) : {};

              if (baseData.last_updated !== prData.last_updated) {
                return {
                  from: baseData.last_updated || '(empty)',
                  to: prData.last_updated || '(empty)'
                };
              }
              return null;
            } catch (e) {
              return null;
            }
          })();

          // translations-data.json diff
          const translationsChanges = (() => {
            try {
              const basePath = 'base/lib/source/translations-data.json';
              const prPath = 'pr/lib/source/translations-data.json';

              const baseExists = fs.existsSync(basePath);
              const prExists = fs.existsSync(prPath);

              if (!baseExists && !prExists) return { added: [], removed: [], modified: [] };

              const baseData = baseExists ? JSON.parse(fs.readFileSync(basePath, 'utf8')) : [];
              const prData = prExists ? JSON.parse(fs.readFileSync(prPath, 'utf8')) : [];

              const baseMap = new Map(baseData.map(item => [item.id, item]));
              const prMap = new Map(prData.map(item => [item.id, item]));

              const added = [];
              const removed = [];
              const modified = [];

              for (const [id, prItem] of prMap) {
                const baseItem = baseMap.get(id);
                if (!baseItem) {
                  added.push(prItem);
                } else {
                  const shortcutChanged = baseItem.shortcut !== prItem.shortcut;
                  const baseMultiwords = JSON.stringify(baseItem.multiwords || []);
                  const prMultiwords = JSON.stringify(prItem.multiwords || []);
                  const multiwordsChanged = baseMultiwords !== prMultiwords;

                  if (shortcutChanged || multiwordsChanged) {
                    modified.push({ base: baseItem, pr: prItem, shortcutChanged, multiwordsChanged });
                  }
                }
              }

              for (const [id, baseItem] of baseMap) {
                if (!prMap.has(id)) {
                  removed.push(baseItem);
                }
              }

              return { added, removed, modified };
            } catch (e) {
              console.error(e);
              return { added: [], removed: [], modified: [] };
            }
          })();

          // Build report
          report += '## Database Changes Report\n\n';

          // Versions section
          if (versionsChanged) {
            const daysDiff = (() => {
              try {
                const from = new Date(versionsChanged.from);
                const to = new Date(versionsChanged.to);
                const diff = Math.round((to - from) / (1000 * 60 * 60 * 24));
                return diff;
              } catch (e) {
                return null;
              }
            })();
            report += '> **Version Update:** ';
            report += `\`${versionsChanged.from}\` → \`${versionsChanged.to}\``;
            if (daysDiff !== null) {
              report += ` (${daysDiff} days)`;
            }
            report += '\n\n';
          }
          report += '\n';

          const { added, removed, modified } = translationsChanges;
          const hasChanges = added.length > 0 || removed.length > 0 || modified.length > 0;

          if (!hasChanges) {
            report += '_No shortcut or multiword changes detected._\n';
          } else {
            const shortcutChanges = [];
            const multiwordChanges = [];

            for (const item of added) {
              if (item.shortcut) {
                shortcutChanges.push({ theme: item.theme, type: 'added', value: item.shortcut });
              }
              if (item.multiwords && item.multiwords.length > 0) {
                multiwordChanges.push({ theme: item.theme, type: 'added', value: item.multiwords });
              }
            }

            for (const item of removed) {
              if (item.shortcut) {
                shortcutChanges.push({ theme: item.theme, type: 'removed', value: item.shortcut });
              }
              if (item.multiwords && item.multiwords.length > 0) {
                multiwordChanges.push({ theme: item.theme, type: 'removed', value: item.multiwords });
              }
            }

            for (const item of modified) {
              if (item.shortcutChanged) {
                shortcutChanges.push({
                  theme: item.pr.theme,
                  type: 'modified',
                  from: item.base.shortcut,
                  to: item.pr.shortcut
                });
              }
              if (item.multiwordsChanged) {
                multiwordChanges.push({
                  theme: item.pr.theme,
                  type: 'modified',
                  from: item.base.multiwords || [],
                  to: item.pr.multiwords || []
                });
              }
            }

            const diffMultiwords = (from, to) => {
              const fromMap = new Map(from.map(m => [m.multiword, m]));
              const toMap = new Map(to.map(m => [m.multiword, m]));
              const lines = [];
              for (const m of from) {
                if (!toMap.has(m.multiword)) {
                  lines.push({ type: '-', content: JSON.stringify(m, null, 2) });
                } else {
                  lines.push({ type: ' ', content: JSON.stringify(toMap.get(m.multiword), null, 2) });
                }
              }
              for (const m of to) {
                if (!fromMap.has(m.multiword)) {
                  lines.push({ type: '+', content: JSON.stringify(m, null, 2) });
                }
              }
              return lines;
            };

            if (shortcutChanges.length > 0) {
              report += '### Shortcuts\n\n';
              shortcutChanges.forEach((item, idx) => {
                const formatShortcut = (val) => val == null ? '*null*' : `\`${val}\``;
                let from, to;
                if (item.type === 'added') {
                  from = '*n/a*';
                  to = formatShortcut(item.value);
                } else if (item.type === 'removed') {
                  from = formatShortcut(item.value);
                  to = '*n/a*';
                } else {
                  from = formatShortcut(item.from);
                  to = formatShortcut(item.to);
                }
                report += `${idx + 1}. **${item.theme}**: ${from} -> ${to}\n`;
              });
              report += '\n';
            }

            if (multiwordChanges.length > 0) {
              report += '### Multiwords\n\n';
              multiwordChanges.forEach((item, idx) => {
                report += `${idx + 1}. **${item.theme}**\n\n`;
                report += '```diff\n';
                if (item.type === 'added') {
                  for (const mw of item.value) {
                    const lines = JSON.stringify(mw, null, 2).split('\n');
                    for (const line of lines) {
                      report += `+  ${line}\n`;
                    }
                  }
                } else if (item.type === 'removed') {
                  for (const mw of item.value) {
                    const lines = JSON.stringify(mw, null, 2).split('\n');
                    for (const line of lines) {
                      report += `-  ${line}\n`;
                    }
                  }
                } else {
                  const diffLines = diffMultiwords(item.from, item.to);
                  for (const d of diffLines) {
                    const lines = d.content.split('\n');
                    for (const line of lines) {
                      report += `${d.type}  ${line}\n`;
                    }
                  }
                }
                report += '```\n\n';
              });
            }
          }

          report += '---\n';
          report += '_This report is automatically generated._\n';

          fs.writeFileSync('diff_report.md', report);
          EOF

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: "github-actions[bot]"
          body-includes: "## Database Changes Report"

      - name: Create or update comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ steps.pr.outputs.number }}
          body-path: diff_report.md
          edit-mode: replace
